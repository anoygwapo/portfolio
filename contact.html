<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aldren — Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navigation">
        <ul class="list">
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>

    <section class="page-section">
        <h2>Contact</h2>
        <p>Have a project in mind, or just want to say hi? Reach out below.</p>

        <div class="contact-info">
            <p>Email: youremail@example.com</p>
            <p>Location: Cebu, Philippines</p>
        </div>

        <div class="contact-links">
            <a href="https://github.com/anoygwapo" target="_blank" rel="noopener">GitHub</a>
            <a href="https://linkedin.com/in/yourusername" target="_blank" rel="noopener">LinkedIn</a>
            <a href="https://www.facebook.com/anoyyyy1" target="_blank" rel="noopener">Facebook</a>
        </div>

        <form class="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here" required></textarea>

            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

   <footer class="site-footer">
        <p>&copy; 2026 Aldren.</p>
    </footer>

</body>
</html>
